ServerName			"Il vault del gabibbo"
ServerType			standalone
Port				21
<Limit LOGIN>
  DenyAll
</Limit>
User				nobody
PassivePorts 50000 50100
Group				nogroup
RequireValidShell       no
MaxInstances                    30
TimeoutStalled			30
<Anonymous ~ftp>
  <Limit LOGIN>
    AllowAll
  </Limit>
  # Maximum clients with message
  MaxClients			300 "Sorry, max %m users -- try again later"
  User				ftp
  Group				ftp
  # We want clients to be able to login with "anonymous" as well as "ftp"
  UserAlias			anonymous ftp
  # Limit WRITE everywhere in the anonymous chroot
  <Limit WRITE>
    DenyAll
  </Limit>
</Anonymous>
